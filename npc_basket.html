<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>NPC Basket</title>

<style>
body{
  font-family: Arial;
  padding: 20px;
  max-width: 900px;
}

h2,h3{margin-top:20px}

select,input,button{
  padding:6px;
  margin:5px;
}

table{
  border-collapse:collapse;
  margin-top:10px;
  width:100%;
}

th,td{
  border:1px solid #ccc;
  padding:6px;
  text-align:right;
}

th:first-child,td:first-child{
  text-align:left;
}

tfoot{
  font-weight:bold;
  background:#eee;
}

.civ{
  margin-right:15px;
}

.removeBtn{
  color:red;
  cursor:pointer;
  font-size:12px;
  font-weight:bold;
  border:none;
  background:none;
  padding:0 4px;
}

.removeBtn:hover{
  transform:scale(1.2);
}

#clearBasket{
  margin-top:10px;
}

</style>
</head>

<body>

<div style="margin-bottom: 20px; padding: 10px; background: #f5f5f5; border-radius: 4px;">
  <label for="languageSelect" id="langLabel">Language / Язык:</label>
  <select id="languageSelect" style="margin-left: 10px;">
    <option value="en">English</option>
    <option value="ru" selected>Русский</option>
  </select>
</div>

<h2 id="pageTitle">NPC корзина</h2>

<h3 id="civLabel">Цивилизация войск</h3>

<label class="civ">
  <input type="radio" name="civ" value="germans" checked>
  <span id="civGermans">Германцы</span>
</label>

<label class="civ">
  <input type="radio" name="civ" value="gauls">
  <span id="civGauls">Галлы</span>
</label>

<label class="civ">
  <input type="radio" name="civ" value="romans">
  <span id="civRomans">Римляне</span>
</label>

<h3 id="troopsLabel">Войска</h3>

<select id="troop"></select>
<input id="troopCount" type="number" min="1" value="10">
<button id="addTroop">+ Добавить</button>

<div id="troopCost"></div>

<h3 id="buildingLabel">Здание</h3>
<select id="b"></select>
<input id="lvl" type="number" min="1" value="1">
<button id="addBuilding">+ Добавить</button>
<div id="cost"></div>

<h3 id="basketLabel">Корзина</h3>

<table>
<thead>
<tr>
  <th id="headerName">Название</th>
  <th id="headerLevel">Ур./Кол</th>
  <th id="headerWood">Дерево</th>
  <th id="headerClay">Глина</th>
  <th id="headerIron">Железо</th>
  <th id="headerGrain">Зерно</th>
  <th id="headerTotal">Всего</th>
  <th></th>
</tr>
</thead>

<tbody id="rows"></tbody>

<tfoot>
<tr>
  <td colspan="2" id="footerTotal">Total</td>
  <td id="t0">0</td>
  <td id="t1">0</td>
  <td id="t2">0</td>
  <td id="t3">0</td>
  <td id="grandTotal">0</td>
  <td></td>

</tfoot>
</table>

<button id="clearBasket">

let currentLang = "ru";

function updateLanguage() {
  const t = translations[currentLang];
  
  document.getElementById("pageTitle").textContent = t.pageTitle;
  document.getElementById("langLabel").textContent = t.langLabel;
  document.getElementById("civLabel").textContent = t.civLabel;
  document.getElementById("civGermans").textContent = t.civGermans;

  document.getElementById("troopsLabel").textContent = t.troopsLabel;
  document.getElementById("buildingLabel").textContent = t.buildingLabel;
  document.getElementById("basketLabel").textContent = t.basketLabel;
  
  document.getElementById("headerName").textContent = t.headerName;
  document.getElementById("headerLevel").textContent = t.headerLevel;
  document.getElementById("headerWood").textContent = t.headerWood;
  document.getElementById("headerClay").textContent = t.headerClay;
  document.getElementById("headerIron").textContent = t.headerIron;
  document.getElementById("headerGrain").textContent = t.headerGrain;
  document.getElementById("headerTotal").textContent = t.headerTotal;
  document.getElementById("footerTotal").textContent = t.footerTotal;
  document.getElementById("clearBasket").textContent = t.clearBasketButton;
  
  // Update button text
  document.getElementById("addTroop").textContent = t.addButton;
  document.getElementById("addBuilding").textContent = t.addButton;
  
  // Reload buildings and troops with new language
  loadBuildingsDropdown();
  loadTroops();
  render();
}

document.getElementById("languageSelect").onchange = function() {
  currentLang = this.value;
  updateLanguage();
};

function cost(b,lvl){
  return b.cost.map(x =>
    RoundMul(x * Math.pow(b.k, lvl-1), 5)
  );
}

// Римляне = копия галлов
troopsByCiv.romans = troopsByCiv.gauls;

let currentCiv = "germans";
let troops = troopsByCiv[currentCiv];

function troopCost(item,count){
  return item.cost.map(x => x * count);
}

function getDisplayName(names, index) {
  return names[index] || "";
}

/* ================= DOM ================= */

const troopSel = document.getElementById("troop");
const troopCount = document.getElementById("troopCount");
const troopCostDiv = document.getElementById("troopCost");

const sel = document.getElementById("b");
const lvlInp = document.getElementById("lvl");
const costDiv = document.getElementById("cost");

const rows = document.getElementById("rows");

let basket = [];

/* ================= INIT ================= */

function loadTroops(){
  troopSel.innerHTML = "";

  const troopNames = currentLang === "en" 
    ? (currentCiv === "romans" ? translations.en.troopsRomans : 
       currentCiv === "gauls" ? translations.en.troopsGauls : 
       translations.en.troopsGermans)
    : (currentCiv === "romans" ? translations.ru.troopsRomans : 
       currentCiv === "gauls" ? translations.ru.troopsGauls : 
       translations.ru.troopsGermans);

  troops.forEach((x,i)=>{
    let o=document.createElement("option");
    o.value=i;
    o.text = getDisplayName(troopNames, i);
    troopSel.add(o);
  });

  refreshTroopCost();
}

function loadBuildingsDropdown(){
  sel.innerHTML = "";
  const buildingNames = translations[currentLang].buildings;
  
  buildings.forEach((x,i)=>{
    let o=document.createElement("option");
    o.value=i;
    o.text = getDisplayName(buildingNames, i);
    sel.add(o);
  });
  
  refreshCost();
}

/* ================= CIV CHANGE ================= */

document.querySelectorAll('input[name="civ"]').forEach(r=>{
  r.onchange = function(){
    currentCiv = this.value;
    troops = troopsByCiv[currentCiv];
    loadTroops();
  };
});

/* ================= BUILDINGS ================= */

function refreshCost(){
  let b = buildings[sel.value];
  let lvl = Math.min(+lvlInp.value, b.maxLvl);
  lvlInp.max = b.maxLvl;

  let c = cost(b,lvl);
  const t = translations[currentLang];
  
  costDiv.innerHTML =
    `${t.cost} 🌲${c[0]} 🧱${c[1]} ⚙️${c[2]} 🌾${c[3]}`;
}

function add(){
  let b = buildings[sel.value];
  let lvl = +lvlInp.value;
  let c = cost(b,lvl);
  
  const buildingNames = translations[currentLang].buildings;
  const displayName = getDisplayName(buildingNames, b.cost === buildings[sel.value].cost ? sel.value : 0);

  basket.push({n:b.name,l:lvl,c,displayName});
  render();
}

/* ================= TROOPS ================= */

function refreshTroopCost(){
  let t = troops[troopSel.value];
  let count = Math.max(1, +troopCount.value);

  let c = troopCost(t,count);
  const trans = translations[currentLang];

  troopCostDiv.innerHTML =
    `${trans.cost} 🌲${c[0]} 🧱${c[1]} ⚙️${c[2]} 🌾${c[3]}`;
}

function addTroop(){
  let t = troops[troopSel.value];
  let count = Math.max(1, +troopCount.value);

  let c = troopCost(t,count);
  
  const troopNames = currentLang === "en" 
    ? (currentCiv === "romans" ? translations.en.troopsRomans : 
       currentCiv === "gauls" ? translations.en.troopsGauls : 
       translations.en.troopsGermans)
    : (currentCiv === "romans" ? translations.ru.troopsRomans : 
       currentCiv === "gauls" ? translations.ru.troopsGauls : 
       translations.ru.troopsGermans);
  
  const displayName = getDisplayName(troopNames, troopSel.value);

  basket.push({n:t.name,l:count,c,displayName});
  render();
}

/* ================= RENDER ================= */

function render(){

  rows.innerHTML="";

  let total=[0,0,0,0];
  let grand=0;

  basket.forEach((x,index)=>{

    let r=rows.insertRow();

    r.insertCell().textContent=x.displayName;
    r.insertCell().textContent=x.l;

    let lineTotal=0;

    x.c.forEach((v,i)=>{

      r.insertCell().textContent=v;

      total[i]+=v;
      lineTotal+=v;

    });

    grand+=lineTotal;

    r.insertCell().textContent=lineTotal;

    let del=r.insertCell();

    let btn=document.createElement("button");

    btn.className="removeBtn";
    btn.textContent="✖";

    btn.onclick=function(){

      basket.splice(index,1);

      render();

    };

    del.appendChild(btn);

  });

  total.forEach((v,i)=>{

    document.getElementById(
      "t"+i
    ).textContent=v;

  });

  grandTotal.textContent=grand;

}

/* ================= EVENTS ================= */

sel.onchange = refreshCost;
lvlInp.oninput = refreshCost;

troopSel.onchange = refreshTroopCost;
troopCount.oninput = refreshTroopCost;

document.getElementById("addTroop").onclick = addTroop;
document.getElementById("addBuilding").onclick = add;

document.getElementById(
  "clearBasket"
).onclick=function(){
  basket=[];
  render();
};

/* ================= START ================= */

loadBuildingsDropdown();
loadTroops();
refreshCost();
refreshTroopCost();
render();

</script>

</body>
</html>
